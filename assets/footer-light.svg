<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 84" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ft-bg-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="ft-border-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.55" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .pulse { animation: ftPulse 2.6s ease-in-out infinite; }
      @keyframes ftPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.35; } }
    </style>
  </defs>
  <rect width="960" height="84" rx="12" fill="url(#ft-bg-light)" />
  <rect x="0.75" y="0.75" width="958.5" height="82.5" rx="11.5" fill="none" stroke="url(#ft-border-light)" stroke-width="1.2" />
  <circle cx="32" cy="42" r="4.5" fill="#0284C7" class="pulse" />
  <text x="48" y="38" fill="#0F172A" class="sans" font-size="14.5" font-weight="700">Building intelligent systems, one experiment at a time.</text>
  <text x="48" y="57" fill="#475569" class="mono" font-size="11">Rohan Pawar · AI/ML Engineer &amp; Data Analyst Internships · rohanpawar0006@gmail.com</text>
  <g transform="translate(768, 25)">
