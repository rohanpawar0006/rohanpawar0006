<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="ph-dash-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="900" height="160" rx="14" fill="url(#ph-bg)" />
  <rect x="2" y="2" width="896" height="156" rx="12" fill="none" stroke="url(#ph-dash-border)" stroke-width="1.5" stroke-dasharray="6,6" />

  <g transform="translate(450, 48)" text-anchor="middle">
    <!-- Icon or Plus Badge -->
    <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#475569" stroke-width="1.2" />
    <text x="0" y="6" fill="#38BDF8" class="font-mono" font-size="18" font-weight="700">+</text>

    <!-- Placeholder Title -->
    <text x="0" y="38" fill="#F8FAFC" class="font-sans" font-size="17" font-weight="700">
      Upcoming: Autonomous AI Agent / Predictive Analytics Engine
    </text>

    <!-- Subtitle instruction -->
    <text x="0" y="62" fill="#94A3B8" class="font-sans" font-size="13">
      [PROJECT 3 SLOT — Drop in your next deployed agent or data analytics project here]
    </text>

    <!-- Chips preview -->
    <text x="0" y="86" fill="#64748B" class="font-mono" font-size="11">
      LangGraph / CrewAI • FastMCP • Next.js • Docker
    </text>
  </g>
</svg>
