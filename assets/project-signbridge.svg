<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="sb-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F24" />
      <stop offset="50%" stop-color="#141432" />
      <stop offset="100%" stop-color="#0A0B1B" />
    </linearGradient>

    <linearGradient id="sb-glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#F43F5E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="sb-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0" />
    </radialGradient>

    <pattern id="sb-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3D3866" fill-opacity="0.3" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      .pulse-dot-violet {
        animation: pulseV 2s infinite ease-in-out;
      }
      @keyframes pulseV {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="310" rx="14" fill="url(#sb-bg-grad)" />
  <rect width="900" height="310" rx="14" fill="url(#sb-glow)" />
  <rect width="900" height="310" rx="14" fill="url(#sb-grid)" />
  <rect width="900" height="310" rx="14" fill="none" stroke="url(#sb-glass-border)" stroke-width="1.2" />

  <!-- Top Glass Highlight Line -->
  <path d="M 20 1 L 880 1" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- LEFT SECTION: Details & Architecture -->
  <!-- Header Badges -->
  <g transform="translate(36, 28)">
    <!-- Featured Badge -->
    <rect x="0" y="0" width="94" height="22" rx="11" fill="#7C4DFF" fill-opacity="0.15" stroke="#7C4DFF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="10" cy="11" r="3" fill="#A78BFA" class="pulse-dot-violet" />
    <text x="20" y="15" fill="#C4B5FD" class="font-mono" font-size="9.5" font-weight="700" letter-spacing="0.5">FEATURED</text>

    <!-- Architecture Callout: Bidirectional ISL -->
    <rect x="104" y="0" width="220" height="22" rx="11" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="114" y="15" fill="#00E5FF" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="0.4">REAL-TIME BI-DIRECTIONAL ISL</text>
  </g>

  <!-- Project Title -->
  <text x="36" y="80" fill="#FFFFFF" class="font-sans" font-size="28" font-weight="800" letter-spacing="-0.5">
    SignBridge AI
  </text>
  <text x="238" y="79" fill="#A78BFA" class="font-mono" font-size="13" font-weight="600">
    // Bridging Signs &amp; Speech
  </text>

  <!-- One-Line Pitch -->
  <text x="36" y="108" fill="#CBD5E1" class="font-sans" font-size="14.5" font-weight="500">
    Two-way communication platform translating Indian Sign Language to speech &amp; vice versa in real time.
  </text>

  <!-- Key Architecture Callouts / Features -->
  <g transform="translate(36, 126)">
    <!-- Feature 1 -->
    <circle cx="5" cy="8" r="3" fill="#A78BFA" />
    <text x="16" y="12" fill="#94A3B8" class="font-sans" font-size="12.5">
      <tspan fill="#F1F5F9" font-weight="600">Sign → Voice Translation:</tspan> MediaPipe landmarks + PyTorch Bi-LSTM (16 gestures + 36-class static)
    </text>

    <!-- Feature 2 -->
    <circle cx="5" cy="30" r="3" fill="#A78BFA" />
    <text x="16" y="34" fill="#94A3B8" class="font-sans" font-size="12.5">
      <tspan fill="#F1F5F9" font-weight="600">Voice → Sign Playback:</tspan> Speech recognition synthesizes animated sign sequences for two-way conversations
    </text>

    <!-- Feature 3 -->
    <circle cx="5" cy="52" r="3" fill="#A78BFA" />
    <text x="16" y="56" fill="#94A3B8" class="font-sans" font-size="12.5">
      <tspan fill="#F1F5F9" font-weight="600">Gamified Dictionary &amp; Practice:</tspan> Interactive ISL learning suite deployed with sub-40ms edge latency
    </text>
  </g>

  <!-- Tech Stack Chips Row -->
  <g transform="translate(36, 212)">
    <!-- Chip 1: PyTorch -->
    <rect x="0" y="0" width="76" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="38" y="16" fill="#F87171" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">PyTorch</text>

    <!-- Chip 2: MediaPipe -->
    <rect x="84" y="0" width="88" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="128" y="16" fill="#67E8F9" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">MediaPipe</text>

    <!-- Chip 3: Bi-LSTM -->
    <rect x="180" y="0" width="75" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="217.5" y="16" fill="#C4B5FD" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">Bi-LSTM</text>

    <!-- Chip 4: React / Vite -->
    <rect x="263" y="0" width="105" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="315.5" y="16" fill="#93C5FD" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">React • Vite</text>

    <!-- Chip 5: Vercel + Render -->
    <rect x="376" y="0" width="124" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="438" y="16" fill="#34D399" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">Vercel • Render</text>
  </g>

  <!-- CTA Action Links Indicator -->
  <g transform="translate(36, 258)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#7C4DFF" fill-opacity="0.15" stroke="#7C4DFF" stroke-width="1" />
    <text x="65" y="18" fill="#C4B5FD" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">VIEW REPO ↗</text>

    <rect x="142" y="0" width="130" height="28" rx="6" fill="#00E5FF" fill-opacity="0.15" stroke="#00E5FF" stroke-width="1" />
    <text x="207" y="18" fill="#00E5FF" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">LIVE DEMO ↗</text>
  </g>

  <!-- RIGHT SECTION: Interactive Glass Mockup Preview Panel -->
  <g transform="translate(570, 28)">
    <!-- Terminal / App Frame -->
    <rect x="0" y="0" width="294" height="254" rx="10" fill="#050614" fill-opacity="0.9" stroke="#252445" stroke-width="1.2" />

    <!-- Titlebar -->
    <rect x="0" y="0" width="294" height="26" rx="10" fill="#11132B" />
    <path d="M 0 16 L 294 16 L 294 26 L 0 26 Z" fill="#11132B" />
    <!-- Window Controls -->
    <circle cx="14" cy="13" r="4" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="27" cy="13" r="4" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="40" cy="13" r="4" fill="#10B981" fill-opacity="0.8" />
    <text x="147" y="16" fill="#818CF8" class="font-mono" font-size="9" text-anchor="middle">signbridge // live_vision_engine</text>

    <!-- Simulated Hand Landmark & Inference UI -->
    <g transform="translate(14, 40)">
      <!-- Camera Feed Box Simulation -->
      <rect x="0" y="0" width="266" height="110" rx="8" fill="#0A0B1A" stroke="#2D2B55" stroke-width="1" />

      <!-- Skeletal Landmark Lines -->
      <path d="M 133 80 L 133 55 L 120 40 M 133 55 L 133 30 M 133 55 L 146 38 M 133 55 L 158 48" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
      <circle cx="133" cy="80" r="4" fill="#7C4DFF" />
      <circle cx="133" cy="55" r="3.5" fill="#00E5FF" />
      <circle cx="120" cy="40" r="3" fill="#00E5FF" />
      <circle cx="133" cy="30" r="3" fill="#00E5FF" />
      <circle cx="146" cy="38" r="3" fill="#00E5FF" />
      <circle cx="158" cy="48" r="3" fill="#00E5FF" />

      <!-- Latency & FPS Badges inside stream -->
      <rect x="10" y="8" width="60" height="18" rx="4" fill="#000000" fill-opacity="0.6" />
      <text x="16" y="20" fill="#34D399" class="font-mono" font-size="8.5">● 38ms</text>

      <rect x="200" y="8" width="56" height="18" rx="4" fill="#000000" fill-opacity="0.6" />
      <text x="208" y="20" fill="#67E8F9" class="font-mono" font-size="8.5">60 FPS</text>

      <!-- Prediction Output Banner -->
      <rect x="0" y="118" width="266" height="42" rx="6" fill="#1E1B4B" fill-opacity="0.6" stroke="#7C4DFF" stroke-width="1" />
      <text x="10" y="134" fill="#A78BFA" class="font-mono" font-size="9">PREDICTED ISL SIGN (98.4%):</text>
      <text x="10" y="150" fill="#FFFFFF" class="font-sans" font-size="12" font-weight="700">"Namaste / Hello" ➔ [Audio Output]</text>

      <!-- Bidirectional Mode Status -->
      <rect x="0" y="168" width="266" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="188" fill="#64748B" class="font-mono" font-size="8.5">MODE: LIVE TWO-WAY DIALOGUE</text>
      <text x="210" y="188" fill="#10B981" class="font-mono" font-size="8.5">ACTIVE</text>
    </g>
  </g>
</svg>
