<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="p-bg-signbridge-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="p-border-signbridge-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.9" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    </style>
  </defs>

  <rect width="960" height="250" rx="14" fill="url(#p-bg-signbridge-light)" />
  <rect x="0.75" y="0.75" width="958.5" height="248.5" rx="13.5" fill="none" stroke="url(#p-border-signbridge-light)" stroke-width="1.3" />
  <path d="M 18 1.2 L 942 1.2" stroke="#FFFFFF" stroke-opacity="0.80" stroke-width="1" />

  <!-- Left Content -->
  <g transform="translate(30, 24)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="219" height="22" rx="11" fill="#F1F5F9" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="12" cy="11" r="3" fill="#7C3AED" />
    <text x="22" y="14.5" fill="#7C3AED" class="mono" font-size="9.5" font-weight="700" letter-spacing="0.5">COMPUTER VISION · REAL-TIME AI</text>

    <!-- Title & Subtitle -->
    <text x="0" y="54" fill="#0F172A" class="sans" font-size="24" font-weight="800" letter-spacing="-0.4">SignBridge-AI</text>
    <text x="0" y="75" fill="#334155" class="sans" font-size="13" font-weight="500">Bidirectional Indian Sign Language communication platform.</text>

    <!-- Problem & Implementation Box -->
    <g transform="translate(0, 90)">
      <rect width="590" height="72" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="14" y="20" fill="#7C3AED" class="mono" font-size="10.5" font-weight="700">PROBLEM:</text>
      <text x="78" y="20" fill="#334155" class="sans" font-size="11.5">Bridging real-time communication between ISL and spoken-language users.</text>
      <text x="14" y="40" fill="#7C3AED" class="mono" font-size="10.5" font-weight="700">SYSTEM:</text>
      <text x="78" y="40" fill="#334155" class="sans" font-size="11.5">MediaPipe hand landmarks + PyTorch BiLSTM dynamic gesture classification.</text>
      <text x="78" y="57" fill="#475569" class="sans" font-size="11.5">Speech-to-sign &amp; sign-to-speech loop, ISL dictionary &amp; practice mode.</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 178)">
      <g transform="translate(0.0, 0)"><rect width="60.8" height="23" rx="6" fill="#F1F5F9" stroke="#0284C7" stroke-opacity="0.38" stroke-width="1" /><text x="30.4" y="15" fill="#0284C7" class="mono" font-size="10.2" font-weight="600" text-anchor="middle">Python</text></g>
      <g transform="translate(68.8, 0)"><rect width="67.6" height="23" rx="6" fill="#F1F5F9" stroke="#7C3AED" stroke-opacity="0.38" stroke-width="1" /><text x="33.8" y="15" fill="#7C3AED" class="mono" font-size="10.2" font-weight="600" text-anchor="middle">PyTorch</text></g>
      <g transform="translate(144.4, 0)"><rect width="81.2" height="23" rx="6" fill="#F1F5F9" stroke="#2563EB" stroke-opacity="0.38" stroke-width="1" /><text x="40.6" y="15" fill="#2563EB" class="mono" font-size="10.2" font-weight="600" text-anchor="middle">MediaPipe</text></g>
      <g transform="translate(233.6, 0)"><rect width="60.8" height="23" rx="6" fill="#F1F5F9" stroke="#0284C7" stroke-opacity="0.38" stroke-width="1" /><text x="30.4" y="15" fill="#0284C7" class="mono" font-size="10.2" font-weight="600" text-anchor="middle">OpenCV</text></g>
      <g transform="translate(302.4, 0)"><rect width="67.6" height="23" rx="6" fill="#F1F5F9" stroke="#2563EB" stroke-opacity="0.38" stroke-width="1" /><text x="33.8" y="15" fill="#2563EB" class="mono" font-size="10.2" font-weight="600" text-anchor="middle">FastAPI</text></g>
      <g transform="translate(378.0, 0)"><rect width="56.0" height="23" rx="6" fill="#F1F5F9" stroke="#7C3AED" stroke-opacity="0.38" stroke-width="1" /><text x="28.0" y="15" fill="#7C3AED" class="mono" font-size="10.2" font-weight="600" text-anchor="middle">React</text></g>
      <g transform="translate(442.0, 0)"><rect width="88.0" height="23" rx="6" fill="#F1F5F9" stroke="#0284C7" stroke-opacity="0.38" stroke-width="1" /><text x="44.0" y="15" fill="#0284C7" class="mono" font-size="10.2" font-weight="600" text-anchor="middle">WebSockets</text></g>
    </g>
  </g>

  <!-- Right Architecture Panel -->
  <g transform="translate(652, 18)">
    <rect width="276" height="214" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.1" />
    <text x="14" y="21" fill="#475569" class="mono" font-size="9.5" font-weight="700" letter-spacing="0.7">PIPELINE // SIGNBRIDGE-AI</text>
    <line x1="14" y1="27" x2="262" y2="27" stroke="#CBD5E1" stroke-width="0.8" />
    <rect x="14" y="34" width="248" height="32" rx="7" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.42" stroke-width="1" /><circle cx="28" cy="50" r="3.2" fill="#0284C7" /><text x="40" y="48" fill="#0F172A" class="mono" font-size="10" font-weight="700">Webcam + MediaPipe</text><text x="40" y="60" fill="#475569" class="sans" font-size="9.5">Real-time hand landmark tracking</text><line x1="138" y1="66" x2="138" y2="78" stroke="#CBD5E1" stroke-width="1.3" /><polygon points="135,75 141,75 138,78" fill="#64748B" /><rect x="14" y="78" width="248" height="32" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.42" stroke-width="1" /><circle cx="28" cy="94" r="3.2" fill="#7C3AED" /><text x="40" y="92" fill="#0F172A" class="mono" font-size="10" font-weight="700">PyTorch BiLSTM</text><text x="40" y="104" fill="#475569" class="sans" font-size="9.5">Dynamic ISL sequence classification</text><line x1="138" y1="110" x2="138" y2="122" stroke="#CBD5E1" stroke-width="1.3" /><polygon points="135,119 141,119 138,122" fill="#64748B" /><rect x="14" y="122" width="248" height="32" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.42" stroke-width="1" /><circle cx="28" cy="138" r="3.2" fill="#2563EB" /><text x="40" y="136" fill="#0F172A" class="mono" font-size="10" font-weight="700">FastAPI + WebSockets</text><text x="40" y="148" fill="#475569" class="sans" font-size="9.5">Low-latency bidirectional stream</text><line x1="138" y1="154" x2="138" y2="166" stroke="#CBD5E1" stroke-width="1.3" /><polygon points="135,163 141,163 138,166" fill="#64748B" /><rect x="14" y="166" width="248" height="32" rx="7" fill="#FFFFFF" stroke="#0284C7" stroke-opacity="0.42" stroke-width="1" /><circle cx="28" cy="182" r="3.2" fill="#0284C7" /><text x="40" y="180" fill="#0F172A" class="mono" font-size="10" font-weight="700">Speech &amp; ISL Playback</text><text x="40" y="192" fill="#475569" class="sans" font-size="9.5">Sign-to-speech + dictionary mode</text>
  </g>
</svg>
