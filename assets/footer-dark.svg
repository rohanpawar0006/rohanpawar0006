<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 84" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ft-bg-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="50%" stop-color="#0D121F" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <linearGradient id="ft-border-dark" x1="0%" y1="0%" x2="100%" y2="0%">
