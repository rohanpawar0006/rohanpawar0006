<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>
    <linearGradient id="ft-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <style>
      .font-mono { font-family: 'JetBrains Mono', Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .wave-glow {
        animation: glowPulse 3s ease-in-out infinite alternate;
      }
      @keyframes glowPulse {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="900" height="80" rx="12" fill="url(#ft-bg)" stroke="#1E293B" stroke-width="1" />

  <!-- Animated Glowing Top Arc -->
  <line x1="20" y1="2" x2="880" y2="2" stroke="url(#ft-line)" stroke-width="2" class="wave-glow" />

  <g transform="translate(450, 42)" text-anchor="middle">
    <text x="0" y="0" fill="#E2E8F0" class="font-sans" font-size="13" font-weight="600" letter-spacing="0.5">
      Crafted with precision by <tspan fill="#00E5FF">Rohan Pawar</tspan>
    </text>
    <text x="0" y="20" fill="#64748B" class="font-mono" font-size="10.5" letter-spacing="0.8">
      ENGINEERED FOR PRODUCTION • ZERO-BLOAT AI • ALWAYS SHIPPING
    </text>
  </g>
</svg>
