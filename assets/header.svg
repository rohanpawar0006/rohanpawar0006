<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0C1222" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#7C4DFF" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3D8BFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="accent-cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>

    <radialGradient id="orb-glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#7C4DFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-glow-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D8BFF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#3D8BFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#3D8BFF" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#384566" fill-opacity="0.35" />
    </pattern>

    <!-- SVG Filters for Glass Blur & Glow -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 14s ease-in-out infinite alternate;
      }
      .pulse-beacon {
        animation: beaconPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .line-shine {
        stroke-dasharray: 200;
        stroke-dashoffset: 400;
        animation: drawLine 6s ease-in-out infinite;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -20px) scale(1.15); }
        100% { transform: translate(-20px, 20px) scale(0.95); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-50px, 25px) scale(1.1); }
        100% { transform: translate(30px, -15px) scale(0.9); }
      }
      @keyframes beaconPulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.3); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 400; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="900" height="270" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Floating Glowing Orbs (in background) -->
  <g filter="url(#soft-blur)">
    <circle class="orb-1" cx="150" cy="80" r="120" fill="url(#orb-glow-1)" />
    <circle class="orb-2" cx="760" cy="190" r="140" fill="url(#orb-glow-2)" />
    <circle class="orb-1" cx="800" cy="60" r="90" fill="url(#orb-glow-3)" />
    <circle class="orb-2" cx="200" cy="220" r="100" fill="url(#orb-glow-2)" />
  </g>

  <!-- Geometric Grid Overlay -->
  <rect width="900" height="270" rx="16" fill="url(#dot-grid)" />

  <!-- Subtle Cybernetic Accent Lines -->
  <path d="M 40 30 L 140 30 L 160 50" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.5" />
  <path d="M 860 240 L 760 240 L 740 220" fill="none" stroke="#7C4DFF" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="160" cy="50" r="2.5" fill="#00E5FF" fill-opacity="0.6" />
  <circle cx="740" cy="220" r="2.5" fill="#7C4DFF" fill-opacity="0.6" />

  <!-- Frosted Glass Card Container -->
  <rect x="25" y="20" width="850" height="230" rx="14" fill="#0F172A" fill-opacity="0.55" stroke="url(#glass-border)" stroke-width="1.2" />

  <!-- Glass Inner Highlight / Specular Reflection -->
  <path d="M 35 21 L 865 21" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" stroke-linecap="round" />

  <!-- Header Top Badges Row -->
  <!-- Status Badge: Open to Internships -->
  <g transform="translate(50, 48)">
    <rect x="0" y="0" width="194" height="26" rx="13" fill="#064E3B" fill-opacity="0.35" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
    <!-- Pulsing Green Dot -->
    <circle cx="14" cy="13" r="5" fill="#10B981" fill-opacity="0.3" class="pulse-beacon" />
    <circle cx="14" cy="13" r="3" fill="#34D399" />
    <text x="26" y="17" fill="#6EE7B7" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="0.5">OPEN TO AI/ML INTERNSHIPS</text>
  </g>

  <!-- Tag Badge: Specialization -->
  <g transform="translate(254, 48)">
    <rect x="0" y="0" width="166" height="26" rx="13" fill="#1E1B4B" fill-opacity="0.5" stroke="#7C4DFF" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="14" cy="13" r="3" fill="#A78BFA" />
    <text x="25" y="17" fill="#C4B5FD" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="0.5">B.E. CSE (AI) • SVCE '27</text>
  </g>

  <!-- Main Hero Title -->
  <text x="50" y="125" fill="url(#title-grad)" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.8">
    Rohan Pawar
  </text>

  <!-- Glowing Subtitle / Role -->
  <text x="50" y="160" fill="#00E5FF" class="font-mono" font-size="16.5" font-weight="600" letter-spacing="1">
    &gt; AI / ML ENGINEER IN THE MAKING
  </text>

  <!-- Tagline / Elevator Pitch -->
  <text x="50" y="196" fill="#E2E8F0" class="font-sans" font-size="15" font-weight="500" letter-spacing="0.1">
    Building AI that actually ships — RAG pipelines, real-time computer vision &amp; autonomous agents.
  </text>

  <!-- Supporting Context -->
  <text x="50" y="222" fill="#94A3B8" class="font-sans" font-size="12.5" font-weight="400">
    Zero-bloat architecture from first principles • Production-focused ML • Ready for high-impact teams
  </text>

  <!-- Right-Hand Futuristic AI Chip / Neural Graphic -->
  <g transform="translate(680, 52)">
    <!-- Outer Octagon / Glass Shield -->
    <rect x="0" y="0" width="165" height="165" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="url(#accent-cyan-violet)" stroke-width="1.2" />

    <!-- Mini Grid inside Graphic -->
    <path d="M 20 55 L 145 55 M 20 110 L 145 110 M 55 20 L 55 145 M 110 20 L 110 145" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

    <!-- Circuit / Graph Nodes -->
    <circle cx="55" cy="55" r="5" fill="#00E5FF" filter="url(#badge-glow)" />
    <circle cx="110" cy="55" r="4" fill="#3D8BFF" />
    <circle cx="82.5" cy="82.5" r="7" fill="#7C4DFF" filter="url(#badge-glow)" />
    <circle cx="55" cy="110" r="4" fill="#3D8BFF" />
    <circle cx="110" cy="110" r="5" fill="#00E5FF" filter="url(#badge-glow)" />

    <!-- Connecting Edges with subtle pulses -->
    <line x1="55" y1="55" x2="82.5" y2="82.5" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1.5" />
    <line x1="110" y1="55" x2="82.5" y2="82.5" stroke="#7C4DFF" stroke-opacity="0.7" stroke-width="1.5" />
    <line x1="55" y1="110" x2="82.5" y2="82.5" stroke="#7C4DFF" stroke-opacity="0.7" stroke-width="1.5" />
    <line x1="110" y1="110" x2="82.5" y2="82.5" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1.5" />

    <!-- Center Core Label -->
    <text x="82.5" y="140" fill="#94A3B8" class="font-mono" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="1">PROD_AI // CORE</text>
  </g>
</svg>
