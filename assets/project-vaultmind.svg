<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="vm-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="50%" stop-color="#0E162C" />
      <stop offset="100%" stop-color="#090D1A" />
    </linearGradient>

    <linearGradient id="vm-glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#3D8BFF" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#7C4DFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="vm-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3D8BFF" />
    </linearGradient>

    <radialGradient id="vm-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <pattern id="vm-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2E3C5C" fill-opacity="0.3" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      .chip-anim {
        transition: transform 0.3s ease;
      }
      .pulse-dot {
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="310" rx="14" fill="url(#vm-bg-grad)" />
  <rect width="900" height="310" rx="14" fill="url(#vm-glow)" />
  <rect width="900" height="310" rx="14" fill="url(#vm-grid)" />
  <rect width="900" height="310" rx="14" fill="none" stroke="url(#vm-glass-border)" stroke-width="1.2" />

  <!-- Top Glass Highlight Line -->
  <path d="M 20 1 L 880 1" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- LEFT SECTION: Details & Architecture -->
  <!-- Header Badges -->
  <g transform="translate(36, 28)">
    <!-- Featured Badge -->
    <rect x="0" y="0" width="94" height="22" rx="11" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="10" cy="11" r="3" fill="#00E5FF" class="pulse-dot" />
    <text x="20" y="15" fill="#00E5FF" class="font-mono" font-size="9.5" font-weight="700" letter-spacing="0.5">FEATURED</text>

    <!-- Architecture Callout: Zero LangChain -->
    <rect x="104" y="0" width="186" height="22" rx="11" fill="#7C4DFF" fill-opacity="0.15" stroke="#7C4DFF" stroke-opacity="0.4" stroke-width="1" />
    <text x="114" y="15" fill="#C4B5FD" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="0.4">RAW PRIMITIVES • NO LANGCHAIN</text>
  </g>

  <!-- Project Title -->
  <text x="36" y="80" fill="#FFFFFF" class="font-sans" font-size="28" font-weight="800" letter-spacing="-0.5">
    VaultMind-RAG
  </text>
  <text x="250" y="79" fill="#00E5FF" class="font-mono" font-size="13" font-weight="600">
    // Obsidian AI Brain
  </text>

  <!-- One-Line Pitch -->
  <text x="36" y="108" fill="#CBD5E1" class="font-sans" font-size="14.5" font-weight="500">
    Custom RAG assistant for local Obsidian vaults, engineered from scratch to expose core mechanics.
  </text>

  <!-- Key Architecture Callouts / Features -->
  <g transform="translate(36, 126)">
    <!-- Feature 1 -->
    <circle cx="5" cy="8" r="3" fill="#00E5FF" />
    <text x="16" y="12" fill="#94A3B8" class="font-sans" font-size="12.5">
      <tspan fill="#F1F5F9" font-weight="600">Deterministic Pipeline:</tspan> Note sanitizing → custom sliding-window chunker → local ChromaDB
    </text>

    <!-- Feature 2 -->
    <circle cx="5" cy="30" r="3" fill="#00E5FF" />
    <text x="16" y="34" fill="#94A3B8" class="font-sans" font-size="12.5">
      <tspan fill="#F1F5F9" font-weight="600">Strict Grounding:</tspan> Cosine similarity threshold gate refuses ungrounded queries; zero hallucinations
    </text>

    <!-- Feature 3 -->
    <circle cx="5" cy="52" r="3" fill="#00E5FF" />
    <text x="16" y="56" fill="#94A3B8" class="font-sans" font-size="12.5">
      <tspan fill="#F1F5F9" font-weight="600">Obsidian Citations:</tspan> Interactive note references linking directly back to source markdown files
    </text>
  </g>

  <!-- Tech Stack Chips Row -->
  <g transform="translate(36, 212)">
    <!-- Chip 1: Python -->
    <rect x="0" y="0" width="72" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="36" y="16" fill="#93C5FD" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">Python</text>

    <!-- Chip 2: sentence-transformers -->
    <rect x="80" y="0" width="160" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="160" y="16" fill="#C4B5FD" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">all-MiniLM-L6-v2</text>

    <!-- Chip 3: ChromaDB -->
    <rect x="248" y="0" width="84" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="290" y="16" fill="#67E8F9" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">ChromaDB</text>

    <!-- Chip 4: Gemini Flash -->
    <rect x="340" y="0" width="105" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="392.5" y="16" fill="#FDE047" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">Gemini Flash</text>

    <!-- Chip 5: Streamlit -->
    <rect x="453" y="0" width="86" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="496" y="16" fill="#FCA5A5" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">Streamlit</text>
  </g>

  <!-- CTA Action Link Indicator -->
  <g transform="translate(36, 258)">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="1" />
    <text x="70" y="18" fill="#00E5FF" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">VIEW REPO ↗</text>
  </g>

  <!-- RIGHT SECTION: Interactive Glass Mockup Preview Panel -->
  <g transform="translate(570, 28)">
    <!-- Terminal / App Frame -->
    <rect x="0" y="0" width="294" height="254" rx="10" fill="#030712" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2" />

    <!-- Terminal Titlebar -->
    <rect x="0" y="0" width="294" height="26" rx="10" fill="#0F172A" />
    <path d="M 0 16 L 294 16 L 294 26 L 0 26 Z" fill="#0F172A" />
    <!-- Window Controls -->
    <circle cx="14" cy="13" r="4" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="27" cy="13" r="4" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="40" cy="13" r="4" fill="#10B981" fill-opacity="0.8" />
    <text x="147" y="16" fill="#64748B" class="font-mono" font-size="9" text-anchor="middle">vaultmind-rag // query_runner</text>

    <!-- Simulated Pipeline Trace inside Mockup -->
    <g transform="translate(14, 40)">
      <!-- Step 1 -->
      <text x="0" y="12" fill="#64748B" class="font-mono" font-size="9.5">&gt; Loading Markdown Vault...</text>
      <text x="0" y="27" fill="#38BDF8" class="font-mono" font-size="9.5">✓ 42 notes chunked (window: 400)</text>

      <!-- Step 2 -->
      <text x="0" y="47" fill="#64748B" class="font-mono" font-size="9.5">&gt; Query: "Distributed systems latency"</text>
      <text x="0" y="62" fill="#A78BFA" class="font-mono" font-size="9.5">✓ ChromaDB cosine sim: 0.842</text>

      <!-- Step 3 Grounding Card -->
      <rect x="0" y="74" width="266" height="58" rx="6" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="92" fill="#34D399" class="font-mono" font-size="9">✓ Grounding Gate: PASSED (&gt;0.70)</text>
      <text x="10" y="108" fill="#E2E8F0" class="font-mono" font-size="8.5">Source: notes/architecture/raft.md</text>
      <text x="10" y="122" fill="#94A3B8" class="font-mono" font-size="8">Citation: [[raft#consensus-latency]]</text>

      <!-- Step 4 -->
      <rect x="0" y="142" width="266" height="42" rx="6" fill="#022C22" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
      <text x="10" y="158" fill="#6EE7B7" class="font-mono" font-size="9">GEMINI FLASH RESPONSE:</text>
      <text x="10" y="172" fill="#D1FAE5" class="font-mono" font-size="8">Synthesized response with zero hallucination.</text>
    </g>
  </g>
</svg>
