<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sbp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B1A" />
      <stop offset="100%" stop-color="#03040C" />
    </linearGradient>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#sbp-bg)" stroke="#27274E" stroke-width="2" />

  <!-- App Header -->
  <rect width="800" height="50" rx="12" fill="#131432" />
  <path d="M 0 35 L 800 35 L 800 50 L 0 50 Z" fill="#131432" />
  <circle cx="25" cy="25" r="6" fill="#EF4444" />
  <circle cx="45" cy="25" r="6" fill="#F59E0B" />
  <circle cx="65" cy="25" r="6" fill="#10B981" />
  <text x="400" y="30" fill="#A78BFA" class="font-mono" font-size="14" text-anchor="middle">SignBridge AI // Real-Time Bi-Directional ISL Platform</text>

  <!-- Left: Camera Stream Simulation -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="420" height="340" rx="10" fill="#060714" stroke="#7C4DFF" stroke-opacity="0.5" stroke-width="1.5" />

    <!-- Landmark Points Simulation -->
    <path d="M 210 240 L 210 160 L 170 120 M 210 160 L 210 90 M 210 160 L 250 110 M 210 160 L 280 140" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="210" cy="240" r="7" fill="#7C4DFF" />
    <circle cx="210" cy="160" r="6" fill="#00E5FF" />
    <circle cx="170" cy="120" r="5" fill="#00E5FF" />
    <circle cx="210" cy="90" r="5" fill="#00E5FF" />
    <circle cx="250" cy="110" r="5" fill="#00E5FF" />
    <circle cx="280" cy="140" r="5" fill="#00E5FF" />

    <!-- HUD Overlay -->
    <rect x="15" y="15" width="110" height="26" rx="6" fill="#000000" fill-opacity="0.7" />
    <text x="25" y="32" fill="#34D399" class="font-mono" font-size="11">● LIVE STREAM</text>

    <rect x="315" y="15" width="90" height="26" rx="6" fill="#000000" fill-opacity="0.7" />
    <text x="325" y="32" fill="#38BDF8" class="font-mono" font-size="11">LATENCY: 38ms</text>
  </g>

  <!-- Right: Two-Way Conversation Panel -->
  <g transform="translate(480, 75)">
    <rect x="0" y="0" width="280" height="340" rx="10" fill="#0D0E24" stroke="#1F2044" stroke-width="1" />
    <text x="20" y="30" fill="#C4B5FD" class="font-mono" font-size="12" font-weight="700">TWO-WAY DIALOGUE</text>

    <!-- Detected sign message -->
    <rect x="15" y="50" width="250" height="70" rx="8" fill="#18193D" stroke="#7C4DFF" stroke-width="1" />
    <text x="25" y="70" fill="#00E5FF" class="font-mono" font-size="10">ISL SIGN DETECTED (Confidence: 98.4%)</text>
    <text x="25" y="95" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="700">"Thank you / Dhanyawad"</text>
    <text x="25" y="112" fill="#94A3B8" class="font-mono" font-size="9">🔊 Synthesized to Audio Speech</text>

    <!-- Reply Speech to Sign -->
    <rect x="15" y="135" width="250" height="70" rx="8" fill="#18193D" stroke="#3D8BFF" stroke-width="1" />
    <text x="25" y="155" fill="#93C5FD" class="font-mono" font-size="10">SPOKEN VOICE INPUT</text>
    <text x="25" y="180" fill="#FFFFFF" class="font-sans" font-size="14" font-weight="600">"You are welcome!"</text>
    <text x="25" y="197" fill="#34D399" class="font-mono" font-size="9">▶ Playing 3D Avatar Sign Gesture</text>

    <!-- Features badge bar -->
    <rect x="15" y="220" width="250" height="100" rx="8" fill="#070814" stroke="#252445" stroke-width="1" />
    <text x="25" y="245" fill="#A78BFA" class="font-mono" font-size="10" font-weight="700">ACTIVE MODULES</text>
    <text x="25" y="270" fill="#94A3B8" class="font-sans" font-size="11">✓ 16 Dynamic ISL Gestures</text>
    <text x="25" y="290" fill="#94A3B8" class="font-sans" font-size="11">✓ 36-Class Alphabet/Digits</text>
    <text x="25" y="310" fill="#94A3B8" class="font-sans" font-size="11">✓ Gamified Learning Dictionary</text>
  </g>
</svg>
